<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WSI画像教材ビューアー</title>
  <meta name="description" content="病理・細胞診の学習用WSI画像ビューアー">
  <style>
    :root { color-scheme: light; --navy:#18324b; --blue:#2563eb; --bg:#f3f6fa; --line:#d8e0ea; --muted:#64748b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",sans-serif; color:#172033; background:var(--bg); }
    header { background:var(--navy); color:white; padding:18px 22px; }
    header h1 { margin:0 0 5px; font-size:1.35rem; }
    header p { margin:0; color:#dbeafe; font-size:.92rem; }
    .layout { display:grid; grid-template-columns:320px minmax(0,1fr); gap:16px; padding:16px; max-width:1600px; margin:auto; }
    aside, main { background:white; border:1px solid var(--line); border-radius:12px; overflow:hidden; min-width:0; }
    .panel-head { padding:14px 16px; border-bottom:1px solid var(--line); }
    .panel-head h2 { font-size:1.05rem; margin:0; }
    .case-list { padding:10px; display:grid; gap:8px; }
    .case-item { display:block; width:100%; text-align:left; border:1px solid var(--line); background:white; border-radius:9px; padding:12px; cursor:pointer; color:inherit; }
    .case-item:hover { border-color:#93b4f8; background:#f8fbff; }
    .case-item.active { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue) inset; background:#eff6ff; }
    .case-item strong { display:block; margin-bottom:4px; }
    .case-item small { color:var(--muted); }
    .notice { margin:10px; padding:11px; border-radius:8px; background:#fff7ed; color:#9a3412; font-size:.84rem; line-height:1.5; }
    .viewer-top { padding:12px 14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
    .viewer-top strong { margin-right:auto; }
    button, input, textarea { font:inherit; }
    .tool { border:1px solid var(--line); border-radius:7px; background:#fff; padding:7px 10px; cursor:pointer; }
    .tool:hover { background:#f1f5f9; }
    #viewer { width:100%; height:min(68vh,760px); min-height:380px; background:#161b22; }
    .details { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr); gap:18px; padding:16px; }
    .details h2 { margin:0 0 10px; font-size:1.2rem; }
    .metadata { display:grid; grid-template-columns:100px 1fr; gap:7px 10px; font-size:.93rem; }
    .metadata dt { color:var(--muted); }
    .metadata dd { margin:0; overflow-wrap:anywhere; }
    .memo-label { display:block; font-weight:650; margin:0 0 7px; }
    textarea { width:100%; min-height:125px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:10px; }
    .memo-actions { display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
    .primary { background:var(--blue); border-color:var(--blue); color:white; }
    #status { color:var(--muted); font-size:.85rem; }
    footer { text-align:center; color:var(--muted); padding:0 16px 22px; font-size:.82rem; }
    .empty { color:var(--muted); padding:20px; }
    @media (max-width:850px) {
      .layout { grid-template-columns:1fr; padding:10px; }
      .case-list { grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
      #viewer { min-height:320px; height:55vh; }
      .details { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<header>
  <h1>WSI画像教材ビューアー</h1>
  <p>病理・細胞診の学習用サイト｜症例を選び、拡大・縮小して観察できます</p>
</header>

<div class="layout">
  <aside>
    <div class="panel-head"><h2>教材一覧</h2></div>
    <div style="padding:10px 10px 0">
      <input id="search" type="search" placeholder="症例名・臓器・染色で検索" aria-label="教材を検索"
        style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px">
    </div>
    <div id="case-list" class="case-list"><div class="empty">教材一覧を読み込んでいます…</div></div>
    <div class="notice">このサイトは公開用のデモです。個人情報・患者情報を含む画像や記録は登録しないでください。</div>
  </aside>

  <main>
    <div class="viewer-top">
      <strong id="viewer-heading">画像を読み込んでいます…</strong>
      <button class="tool" id="zoom-in" type="button" title="拡大">＋ 拡大</button>
      <button class="tool" id="zoom-out" type="button" title="縮小">－ 縮小</button>
      <button class="tool" id="home" type="button">全体表示</button>
      <button class="tool" id="fullscreen" type="button">全画面</button>
    </div>
    <div id="viewer" aria-label="WSI画像ビューアー"></div>
    <section class="details">
      <div>
        <h2 id="case-title">教材</h2>
        <dl class="metadata">
          <dt>臓器・材料</dt><dd id="organ">—</dd>
          <dt>染色</dt><dd id="stain">—</dd>
          <dt>倍率・条件</dt><dd id="magnification">—</dd>
          <dt>学習ポイント</dt><dd id="description">—</dd>
        </dl>
      </div>
      <div>
        <label class="memo-label" for="memo">自分用の学習メモ</label>
        <textarea id="memo" placeholder="観察した所見や鑑別のポイントなどを入力"></textarea>
        <div class="memo-actions">
          <button class="tool primary" id="save-memo" type="button">この端末に保存</button>
          <button class="tool" id="clear-memo" type="button">メモを消去</button>
          <span id="status" role="status">メモはこのブラウザ内に保存されます。</span>
        </div>
      </div>
    </section>
  </main>
</div>
<footer>GitHub Pages + OpenSeadragon｜学習目的</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
<script>
(() => {
  "use strict";
  const listEl = document.getElementById("case-list");
  const searchEl = document.getElementById("search");
  const statusEl = document.getElementById("status");
  let cases = [];
  let selectedId = null;
  let viewer = null;

  const byId = id => cases.find(c => c.id === id);
  const memoKey = id => "wsi-study-memo:" + id;

  function initViewer() {
    if (!window.OpenSeadragon) {
      document.getElementById("viewer").innerHTML =
        '<div style="color:white;padding:20px">ビューアーを読み込めません。インターネット接続を確認してください。</div>';
      return;
    }
    viewer = OpenSeadragon({
      id: "viewer",
      prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/images/",
      showNavigator: true,
      navigatorPosition: "BOTTOM_RIGHT",
      animationTime: 0.8,
      blendTime: 0.1,
      minZoomLevel: 0.5,
      maxZoomLevel: 30,
      visibilityRatio: 0.5,
      constrainDuringPan: false,
      gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true, scrollToZoom: true }
    });
    viewer.addHandler("open-failed", () => {
      statusEl.textContent = "画像を開けません。DZIファイルのパスとタイル一式を確認してください。";
    });
  }

  function renderList(filter = "") {
    const q = filter.trim().toLocaleLowerCase("ja");
    const filtered = cases.filter(c =>
      [c.title, c.organ, c.stain, c.description].join(" ").toLocaleLowerCase("ja").includes(q));
    listEl.replaceChildren();
    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "該当する教材がありません。";
      listEl.appendChild(empty);
      return;
    }
    filtered.forEach(c => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "case-item" + (c.id === selectedId ? " active" : "");
      const title = document.createElement("strong");
      title.textContent = c.title;
      const meta = document.createElement("small");
      meta.textContent = [c.organ, c.stain].filter(Boolean).join(" ・ ");
      btn.append(title, meta);
      btn.addEventListener("click", () => selectCase(c.id));
      listEl.appendChild(btn);
    });
  }

  function selectCase(id) {
    const c = byId(id);
    if (!c) return;
    selectedId = id;
    renderList(searchEl.value);
    document.getElementById("viewer-heading").textContent = c.title;
    document.getElementById("case-title").textContent = c.title;
    document.getElementById("organ").textContent = c.organ || "—";
    document.getElementById("stain").textContent = c.stain || "—";
    document.getElementById("magnification").textContent = c.magnification || "—";
    document.getElementById("description").textContent = c.description || "—";
    document.getElementById("memo").value = localStorage.getItem(memoKey(id)) || "";
    statusEl.textContent = "メモはこのブラウザ内に保存されます。";
    if (viewer) {
      viewer.close();
      viewer.open({ tileSource: c.dzi });
    }
  }

  document.getElementById("zoom-in").addEventListener("click", () => {
    if (viewer) viewer.viewport.zoomBy(1.5);
    if (viewer) viewer.viewport.applyConstraints();
  });
  document.getElementById("zoom-out").addEventListener("click", () => {
    if (viewer) viewer.viewport.zoomBy(1 / 1.5);
    if (viewer) viewer.viewport.applyConstraints();
  });
  document.getElementById("home").addEventListener("click", () => {
    if (viewer) viewer.viewport.goHome();
  });
  document.getElementById("fullscreen").addEventListener("click", () => {
    if (viewer) viewer.setFullScreen(!viewer.isFullPage());
  });
  searchEl.addEventListener("input", () => renderList(searchEl.value));
  document.getElementById("save-memo").addEventListener("click", () => {
    if (!selectedId) return;
    localStorage.setItem(memoKey(selectedId), document.getElementById("memo").value);
    statusEl.textContent = "保存しました（この端末・このブラウザのみ）。";
  });
  document.getElementById("clear-memo").addEventListener("click", () => {
    if (!selectedId) return;
    document.getElementById("memo").value = "";
    localStorage.removeItem(memoKey(selectedId));
    statusEl.textContent = "この症例のメモを消去しました。";
  });

  async function start() {
    initViewer();
    try {
      const response = await fetch("./cases.json", { cache: "no-store" });
      if (!response.ok) throw new Error("cases.json の読み込みに失敗しました (" + response.status + ")");
      cases = await response.json();
      if (!Array.isArray(cases) || !cases.length) throw new Error("cases.json に教材がありません。");
      renderList();
      selectCase(cases[0].id);
    } catch (e) {
      listEl.innerHTML = "";
      const message = document.createElement("div");
      message.className = "empty";
      message.textContent = "教材一覧を読み込めませんでした。index.html と cases.json が同じ場所にあるか確認してください。詳細: " + e.message;
      listEl.appendChild(message);
      document.getElementById("viewer-heading").textContent = "教材の読み込みエラー";
    }
  }
  start();
})();
</script>
</body>
</html>
